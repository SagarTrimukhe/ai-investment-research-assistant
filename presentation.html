<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Investment Research Assistant - 65-Slide Defense Presentation & Complete Code Flow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: rgba(18, 24, 38, 0.75);
      --bg-card-border: rgba(255, 255, 255, 0.08);
      --bg-card-hover: rgba(26, 35, 54, 0.85);
      --accent-cyan: #06b6d4;
      --accent-cyan-glow: rgba(6, 182, 212, 0.25);
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --code-bg: #050811;
      --code-border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Ambient background glow */
    .ambient-glow {
      position: fixed;
      top: -20%;
      left: -10%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, rgba(6, 182, 212, 0.03) 40%, transparent 70%);
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }

    .ambient-glow-2 {
      position: fixed;
      bottom: -20%;
      right: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.07) 0%, rgba(244, 63, 94, 0.03) 40%, transparent 70%);
      filter: blur(90px);
      z-index: 0;
      pointer-events: none;
    }

    /* Top Header & Progress Bar */
    header {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 28px;
      border-bottom: 1px solid var(--bg-card-border);
      background: rgba(9, 13, 22, 0.8);
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-badge {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: #fff;
      font-weight: 800;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.2px;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--bg-card-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .slide-progress-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.05);
    }

    .slide-progress-bar {
      height: 100%;
      width: 2%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-blue), var(--accent-purple));
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Main Presentation Stage */
    main {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 36px;
      overflow: hidden;
    }

    .slide-viewport {
      width: 100%;
      max-width: 1280px;
      height: 100%;
      max-height: 820px;
      background: var(--bg-card);
      border: 1px solid var(--bg-card-border);
      border-radius: 20px;
      padding: 36px 48px;
      box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-y: auto;
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Custom scrollbar inside slide */
    .slide-viewport::-webkit-scrollbar {
      width: 6px;
    }
    .slide-viewport::-webkit-scrollbar-track {
      background: transparent;
    }
    .slide-viewport::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px) scale(0.995); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Slide Content Typography & Layouts */
    .slide-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .module-pill {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent-cyan);
      background: var(--accent-cyan-glow);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid rgba(6, 182, 212, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .slide-number-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-dim);
      font-weight: 500;
    }

    h1.slide-title {
      font-family: 'Outfit', sans-serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #fff;
      margin-bottom: 8px;
      line-height: 1.25;
    }

    p.slide-subtitle {
      font-size: 16px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .slide-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
      user-select: text;
    }

    /* Grid Layouts */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--bg-card-border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.25s ease;
    }

    .card:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.16);
      transform: translateY(-2px);
    }

    .card.highlight {
      border-color: rgba(6, 182, 212, 0.4);
      background: rgba(6, 182, 212, 0.05);
    }

    .card.highlight-purple {
      border-color: rgba(139, 92, 246, 0.4);
      background: rgba(139, 92, 246, 0.05);
    }

    .card.highlight-emerald {
      border-color: rgba(16, 185, 129, 0.4);
      background: rgba(16, 185, 129, 0.05);
    }

    .card-title {
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-text {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .card-text ul {
      margin-left: 18px;
      margin-top: 8px;
    }

    .card-text li {
      margin-bottom: 6px;
    }

    /* Code Blocks */
    .code-container {
      background: var(--code-bg);
      border: 1px solid var(--code-border);
      border-radius: 12px;
      overflow: hidden;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.55;
    }

    .code-header {
      background: rgba(255, 255, 255, 0.04);
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--text-dim);
      font-size: 11px;
    }

    .code-body {
      padding: 14px 16px;
      overflow-x: auto;
      color: #e2e8f0;
      white-space: pre;
    }

    .code-kw { color: #f43f5e; font-weight: 600; }
    .code-fn { color: #38bdf8; font-weight: 500; }
    .code-str { color: #a7f3d0; }
    .code-cm { color: #64748b; font-style: italic; }
    .code-num { color: #fbbf24; }
    .code-hl { background: rgba(56, 189, 248, 0.15); padding: 2px 4px; border-radius: 4px; }

    /* Tables */
    .table-container {
      border: 1px solid var(--bg-card-border);
      border-radius: 12px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }

    th {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-weight: 600;
      padding: 10px 14px;
      border-bottom: 1px solid var(--bg-card-border);
      font-family: 'Outfit', sans-serif;
    }

    td {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    /* Badges & Status */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }
    .badge-cyan { background: rgba(6, 182, 212, 0.15); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.3); }
    .badge-emerald { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-purple { background: rgba(139, 92, 246, 0.15); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.3); }
    .badge-amber { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-rose { background: rgba(244, 63, 94, 0.15); color: #fb7185; border: 1px solid rgba(244, 63, 94, 0.3); }

    /* Invigilator Defense Callout */
    .defense-box {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
      border-left: 4px solid var(--accent-cyan);
      border-radius: 0 12px 12px 0;
      padding: 14px 18px;
      margin-top: 10px;
    }

    .defense-header {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent-cyan);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .defense-text {
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.5;
      font-style: italic;
    }

    /* Diagram Canvas */
    .diagram-canvas {
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .diagram-flow {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .flow-node {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 10px 16px;
      text-align: center;
      min-width: 130px;
    }

    .flow-node.start { border-color: var(--accent-emerald); background: rgba(16, 185, 129, 0.1); }
    .flow-node.router { border-color: var(--accent-cyan); background: rgba(6, 182, 212, 0.1); }
    .flow-node.parallel { border-color: var(--accent-purple); background: rgba(139, 92, 246, 0.1); }
    .flow-node.synthesis { border-color: var(--accent-blue); background: rgba(59, 130, 246, 0.1); }
    .flow-node.hitl { border-color: var(--accent-amber); background: rgba(245, 158, 11, 0.1); }
    .flow-node.end { border-color: var(--accent-rose); background: rgba(244, 63, 94, 0.1); }

    .flow-arrow {
      color: var(--text-dim);
      font-weight: 700;
      font-size: 18px;
    }

    /* Bottom Navigation Bar */
    footer {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 28px;
      border-top: 1px solid var(--bg-card-border);
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(12px);
    }

    .nav-buttons {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-nav {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--bg-card-border);
      color: #fff;
      padding: 8px 18px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-nav:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .btn-nav.primary {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      border: none;
    }

    .btn-nav.primary:hover {
      box-shadow: 0 0 16px var(--accent-cyan-glow);
    }

    .speaker-notes-drawer {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      width: 90%;
      max-width: 980px;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid var(--accent-cyan);
      border-radius: 14px;
      padding: 18px 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(20px);
    }

    .speaker-notes-drawer.open {
      transform: translateX(-50%) translateY(0);
    }

    .notes-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .notes-content {
      font-size: 14px;
      line-height: 1.6;
      color: #e2e8f0;
    }

    /* Slide Index Drawer */
    .index-drawer {
      position: fixed;
      top: 55px;
      right: -380px;
      width: 360px;
      height: calc(100vh - 115px);
      background: rgba(11, 16, 28, 0.98);
      border-left: 1px solid var(--bg-card-border);
      z-index: 90;
      transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 18px;
      overflow-y: auto;
      backdrop-filter: blur(20px);
    }

    .index-drawer.open {
      right: 0;
    }

    .index-item {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      transition: all 0.15s;
    }

    .index-item:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
    }

    .index-item.active {
      background: var(--accent-cyan-glow);
      color: var(--accent-cyan);
      font-weight: 600;
    }
  </style>
</head>

  <div class="ambient-glow"></div>
  <div class="ambient-glow-2"></div>

  <!-- Header -->
  <header>
    <div class="brand">
      <span class="brand-badge">Capstone Defense</span>
      <span class="brand-title">AI Investment Research Assistant</span>
    </div>
    <div class="header-controls">

  <footer>
    <div style="font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 12px;">

      {

        content: `

              <div class="code-body"><span class="code-kw">def</span> <span class="code-fn">human_approval_gate_node</span>(state: AgentState) -> <span class="code-fn">dict</span>:
    <span class="code-cm"># Suspends graph thread and passes payload</span>
    decision = interrupt({
        <span class="code-str">"ticker"</span>: state.get(<span class="code-str">"ticker"</span>),
        <span class="code-str">"draft_thesis"</span>: state.get(<span class="code-str">"draft_thesis"</span>),
        <span class="code-str">"rating"</span>: state.get(<span class="code-str">"rating"</span>),
        <span class="code-str">"target_price"</span>: state.get(<span class="code-str">"target_price"</span>),
    })</div>
            </div>
            <div class="code-container">
              <div class="code-header"><span>app/main.py:L254-L274</span><span>Frontend Event Listener</span></div>
              <div class="code-body"><span class="code-kw">for</span> step <span class="code-kw">in</span> workflow.stream(initial_input, thread_id=thread_id):
    <span class="code-kw">for</span> node_name, updated_state <span class="code-kw">in</span> step.items():
        <span class="code-kw">if</span> node_name == <span class="code-str">"__interrupt__"</span>:
            st.session_state[<span class="code-str">"awaiting_approval"</span>] = <span class="code-kw">True</span>
            st.session_state[<span class="code-str">"workflow"</span>] = workflow
            st.session_state[<span class="code-str">"thread_id"</span>] = thread_id
            st.info(<span class="code-str">"Workflow paused for human review!"</span>)</div>
            </div>
          </div>
          <div class="defense-box">
            <div class="defense-header">⏸️ Zero-Compute Dormancy</div>
            <div class="defense-text">
              At this point in execution, the graph is safely halted. No background polling tasks or while-loops run. The execution state sits serialized in <code>MemorySaver</code>, awaiting user action on Tab 3.
            </div>
          </div>
        `,
        script: "Code Flow 8 is the interrupt gate. hitl.py calls interrupt(), passing the draft thesis. LangGraph commits the thread to MemorySaver and yields '__interrupt__' to main.py. Streamlit saves the workflow and thread_id into session state, pausing without consuming CPU cycles."
      },
      {
        module: "Module 11 • End-to-End Code Flow",
        title: "Code Flow 9: Resumption & Final Report Export",
        subtitle: "Tracing human sign-off submission to Markdown file persistence",
        content: `
          <div class="grid-2">
            <div class="code-container">
              <div class="code-header"><span>app/main.py:L474-L490</span><span>Resumption Trigger</span></div>
              <div class="code-body"><span class="code-kw">if</span> submit_btn:  <span class="code-cm"># User clicked 'Submit Decision'</span>
    approve = (decision == <span class="code-str">"Approve Investment Thesis"</span>)
    wf = st.session_state.get(<span class="code-str">"workflow"</span>)
    th_id = st.session_state.get(<span class="code-str">"thread_id"</span>)
    
    <span class="code-cm"># Resume LangGraph thread with human decision</span>
    res = wf.resume({
        <span class="code-str">"approved"</span>: approve, 
        <span class="code-str">"feedback"</span>: analyst_notes
    }, thread_id=th_id)
    
    <span class="code-cm"># Export report to disk</span>
    export = ExportService()
    export.to_markdown(latest, <span class="code-str">"./reports/AAPL_memo.md"</span>)</div>
            </div>
            <div class="card highlight-emerald">
              <div class="card-title">End-to-End Cycle Complete</div>
              <div class="card-text">
                <ol style="margin-left: 18px; line-height: 1.6;">
                  <li><code>wf.resume()</code> injects the decision dict into <code>human_approval_gate_node</code>.</li>
                  <li>The node returns <code>{"approved": True, "feedback": "..."}</code>.</li>
                  <li>LangGraph steps from <code>human_approval_gate</code> to <code>END</code>.</li>
                  <li><code>ExportService</code> writes the final institutional memo to Markdown on disk.</li>
                  <li>Streamlit displays the certified thesis and renders a success toast.</li>
                </ol>
              </div>
            </div>
          </div>
        `,
        script: "And finally, Code Flow 9 completes the cycle. On Tab 3, the analyst selects 'Approve' and clicks submit. main.py calls wf.resume(), injecting the decision into the paused node. The graph steps to END, and ExportService writes the certified institutional memo to disk. The entire multi-agent lifecycle is complete."
      }
    ];

    // ==========================================
    // PRESENTATION CONTROLLER LOGIC
    // ==========================================
    let currentSlideIndex = 0;
    const totalSlides = slidesData.length;

    const viewport = document.getElementById("slide-viewport");
    const slideIndicator = document.getElementById("slide-indicator");
    const progressBar = document.getElementById("progress-bar");
    const speakerDrawer = document.getElementById("speaker-notes-drawer");
    const notesContent = document.getElementById("notes-content");
    const indexDrawer = document.getElementById("index-drawer");
    const indexList = document.getElementById("index-list");

    function renderSlide(index) {
      if (index < 0) index = 0;
      if (index >= totalSlides) index = totalSlides - 1;
      currentSlideIndex = index;

      const slide = slidesData[index];

      viewport.innerHTML = `
        <div class="slide-meta">
          <span class="module-pill">📂 ${slide.module}</span>
          <span class="slide-number-display">SLIDE ${index + 1} / ${totalSlides}</span>
        </div>
        <h1 class="slide-title">${slide.title}</h1>
        <p class="slide-subtitle">${slide.subtitle}</p>
        <div class="slide-body">
          ${slide.content}
        </div>
      `;

      notesContent.innerHTML = slide.script || "No speaking notes provided for this slide.";
      slideIndicator.textContent = `Slide ${index + 1} of ${totalSlides}`;
      progressBar.style.width = `${((index + 1) / totalSlides) * 100}%`;

      // Update active in index
      document.querySelectorAll(".index-item").forEach((el, idx) => {
        el.classList.toggle("active", idx === index);
      });

      // Reset scroll of viewport
      viewport.scrollTop = 0;
    }

    function populateIndex() {
      indexList.innerHTML = "";
      slidesData.forEach((s, idx) => {
        const item = document.createElement("div");
        item.className = `index-item ${idx === currentSlideIndex ? 'active' : ''}`;
        item.innerHTML = `
          <span>${idx + 1}. ${s.title.substring(0, 32)}...</span>
          <span style="font-size: 10px; color: var(--text-dim);">S${idx + 1}</span>
        `;
        item.addEventListener("click", () => {
          renderSlide(idx);
          indexDrawer.classList.remove("open");
        });
        indexList.appendChild(item);
      });
    }

    function nextSlide() {
      if (currentSlideIndex < totalSlides - 1) {
        renderSlide(currentSlideIndex + 1);
      }
    }

    function prevSlide() {
      if (currentSlideIndex > 0) {
        renderSlide(currentSlideIndex - 1);
      }
    }

    function toggleNotes() {
      speakerDrawer.classList.toggle("open");
    }

    function toggleIndex() {
      indexDrawer.classList.toggle("open");
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    }

    // Keyboard Shortcuts
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
        e.preventDefault();
        nextSlide();
      } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        e.preventDefault();
        prevSlide();
      } else if (e.key.toLowerCase() === "s") {
        e.preventDefault();
        toggleNotes();
      } else if (e.key.toLowerCase() === "i") {
        e.preventDefault();
        toggleIndex();
      } else if (e.key.toLowerCase() === "f") {
        e.preventDefault();
        toggleFullscreen();
      } else if (e.key === "Home") {
        e.preventDefault();
        renderSlide(0);
      } else if (e.key === "End") {
        e.preventDefault();
        renderSlide(totalSlides - 1);
      }
    });

    // Button event listeners
    document.getElementById("btn-next").addEventListener("click", nextSlide);
    document.getElementById("btn-prev").addEventListener("click", prevSlide);
    document.getElementById("btn-toggle-notes").addEventListener("click", toggleNotes);
    document.getElementById("btn-close-notes").addEventListener("click", toggleNotes);
    document.getElementById("btn-toggle-index").addEventListener("click", toggleIndex);
    document.getElementById("btn-fullscreen").addEventListener("click", toggleFullscreen);

    // Initial load
    populateIndex();
    renderSlide(0);
  </script>
</body>
</html>
